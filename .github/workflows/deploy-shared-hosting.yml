name: IPTV Self-Hosted Web Deployment

on:
  push:
    branches: [main]
    paths:
      - 'apps/player/**'
      - '!apps/player/public/catalog.json'
      - 'scripts/prepare-web-public.mjs'
      - 'scripts/hosting/**'
      - '.github/workflows/deploy-shared-hosting.yml'
  schedule:
    # Follow the hourly source sync, including changes not re-triggered by GITHUB_TOKEN.
    - cron: '52 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: iptv-ssh-web-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Publish verified site and updated playlists to SSH hosting
    if: ${{ github.ref == 'refs/heads/main' && vars.IPTV_SSH_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out latest main including refreshed directory snapshot
        uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install and build web application
        working-directory: apps/player
        run: |
          npm install --no-audit --no-fund
          npm run typecheck
          npm test
          npm run build
      - name: Generate public JSON and M3U directory endpoints
        run: |
          node scripts/prepare-web-public.mjs
          test -s apps/player/dist/playlist.m3u
          test -s apps/player/dist/api/catalog.json
          test -s apps/player/dist/api/status.json
          test -s apps/player/dist/.htaccess
          cmp apps/player/dist/api/playlist.m3u apps/player/dist/playlist.m3u
      - name: Prepare and verify restricted SSH deployment credentials
        shell: bash
        env:
          HOST: ${{ secrets.IPTV_SSH_HOST }}
          USERNAME: ${{ secrets.IPTV_SSH_USER }}
          SSH_KEY: ${{ secrets.IPTV_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.IPTV_SSH_KNOWN_HOSTS }}
          TARGET: ${{ secrets.IPTV_SSH_REMOTE_DIR }}
        run: |
          set -euo pipefail
          [[ "$HOST" =~ ^[A-Za-z0-9.-]+$ ]] && [[ "$USERNAME" =~ ^[A-Za-z0-9_-]+$ ]] || {
            echo "::error::Invalid SSH host or username"; exit 1;
          }
          [[ "$TARGET" =~ ^/[A-Za-z0-9_./-]+/$ ]] && [[ "$TARGET" != *'..'* ]] &&
          [[ "$TARGET" != '/' ]] || {
            echo "::error::Invalid web-only destination path"; exit 1;
          }
          test -n "$SSH_KEY" && test -n "$KNOWN_HOSTS" || {
            echo "::error::SSH key and pinned host key are required"; exit 1;
          }
          umask 077
          printf '%s\n' "$SSH_KEY" > "$RUNNER_TEMP/iptv-web-deploy-key"
          printf '%s\n' "$KNOWN_HOSTS" > "$RUNNER_TEMP/iptv-web-known-hosts"
          chmod 600 "$RUNNER_TEMP/iptv-web-deploy-key" "$RUNNER_TEMP/iptv-web-known-hosts"
      - name: Upload site and changed playlists over verified SSH
        shell: bash
        env:
          HOST: ${{ secrets.IPTV_SSH_HOST }}
          USERNAME: ${{ secrets.IPTV_SSH_USER }}
          TARGET: ${{ secrets.IPTV_SSH_REMOTE_DIR }}
        run: |
          set -euo pipefail
          SSH_OPTS="-o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$RUNNER_TEMP/iptv-web-known-hosts -i $RUNNER_TEMP/iptv-web-deploy-key"
          # A dedicated directory is required. No --delete: unrelated hosting files remain untouched.
          ssh $SSH_OPTS "$USERNAME@$HOST" "mkdir -p '$TARGET'"
          rsync -az --delay-updates --chmod=Du=rwx,Dgo=rx,Fu=rw,Fgo=r \
            -e "ssh $SSH_OPTS" apps/player/dist/ "$USERNAME@$HOST:$TARGET"
          echo "Transferred the verified site and its public JSON/M3U files to the configured web root."
      - name: Clear deployment credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/iptv-web-deploy-key" "$RUNNER_TEMP/iptv-web-known-hosts"
