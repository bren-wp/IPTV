name: IPTV Player CI

on:
  push:
    branches: [main, 'feature/**']
    paths:
      - 'apps/player/**'
      - '.github/workflows/player-ci.yml'
  pull_request:
    paths:
      - 'apps/player/**'
      - '.github/workflows/player-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    name: Typecheck, tests and web build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/player
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build website
        run: npm run build
      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: iptv-web
          path: apps/player/dist/
          if-no-files-found: error

  android:
    name: Android debug APK
    runs-on: ubuntu-latest
    needs: web
    defaults:
      run:
        working-directory: apps/player
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare Android SDK
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build web assets
        run: npm run build
      - name: Generate Android project
        run: npx cap add android
      - name: Synchronize Android assets
        run: npx cap sync android
      - name: Assemble debug APK
        run: ./gradlew assembleDebug --no-daemon
        working-directory: apps/player/android
      - name: Upload Android test APK
        uses: actions/upload-artifact@v4
        with:
          name: iptv-android-debug-apk
          path: apps/player/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
