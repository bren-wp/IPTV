name: IPTV Platform CI

on:
  push:
    branches: [main, 'feature/**']
    paths:
      - 'apps/player/**'
      - '!apps/player/public/catalog.json'
      - 'platforms/**'
      - 'scripts/prepare-platform.mjs'
      - 'scripts/patch-android-tv.mjs'
      - 'scripts/generate-app-icons.mjs'
      - 'scripts/configure-android-release.mjs'
      - 'scripts/verify-release-assets.mjs'
      - '.github/workflows/player-ci.yml'
      - '.github/workflows/release-distributions.yml'
      - 'docs/releases/**'
  pull_request:
    paths:
      - 'apps/player/**'
      - '!apps/player/public/catalog.json'
      - 'platforms/**'
      - 'scripts/prepare-platform.mjs'
      - 'scripts/patch-android-tv.mjs'
      - 'scripts/generate-app-icons.mjs'
      - 'scripts/configure-android-release.mjs'
      - 'scripts/verify-release-assets.mjs'
      - '.github/workflows/player-ci.yml'
      - '.github/workflows/release-distributions.yml'
      - 'docs/releases/**'
  workflow_dispatch:

concurrency:
  group: iptv-platform-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

permissions:
  contents: read

jobs:
  web:
    name: Shared tests + Web/Tizen/webOS bundles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install player dependencies
        working-directory: apps/player
        run: npm install --no-audit --no-fund
      - name: Check production dependencies for reported high severity vulnerabilities
        working-directory: apps/player
        run: npm audit --omit=dev --audit-level=high
      - name: Typecheck
        working-directory: apps/player
        run: npm run typecheck
      - name: Unit tests
        working-directory: apps/player
        run: npm test
      - name: Install Chromium for UI smoke tests
        working-directory: apps/player
        run: npx playwright install --with-deps chromium
      - name: Browser interaction tests (desktop and mobile)
        working-directory: apps/player
        run: npm run test:e2e
      - name: Build shared player
        working-directory: apps/player
        run: npm run build
      - name: Prepare separate web and Smart TV bundles
        run: node scripts/prepare-platform.mjs web samsung-tizen lg-webos
      - name: Generate platform icons
        run: |
          node scripts/generate-app-icons.mjs web
          node scripts/generate-app-icons.mjs samsung-tizen
          node scripts/generate-app-icons.mjs lg-webos
      - name: Validate release assets
        run: |
          node scripts/verify-release-assets.mjs web
          node scripts/verify-release-assets.mjs samsung-tizen
          node scripts/verify-release-assets.mjs lg-webos
      - name: Package LG webOS IPK
        run: |
          npm install -g @webos-tools/cli@3.2.6 --no-audit --no-fund
          ares-config --profile tv
          mkdir -p platforms/lg-webos/outputs
          ares-package --no-minify -o platforms/lg-webos/outputs platforms/lg-webos/staging
          test -n "$(find platforms/lg-webos/outputs -name '*.ipk' -size +0c -print -quit)"
      - name: Verify static distribution structure
        run: |
          test -s platforms/web/dist/index.html
          test -s platforms/samsung-tizen/staging/index.html
          test -s platforms/samsung-tizen/staging/config.xml
          test -s platforms/lg-webos/staging/index.html
          test -s platforms/lg-webos/staging/appinfo.json
          python3 -c 'import json,xml.etree.ElementTree as ET; a=json.load(open("platforms/lg-webos/staging/appinfo.json")); assert a["type"]=="web" and a["main"]=="index.html"; root=ET.parse("platforms/samsung-tizen/staging/config.xml").getroot(); assert root.tag.endswith("widget")'
      - uses: actions/upload-artifact@v4
        with:
          name: iptv-web
          path: platforms/web/dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: iptv-samsung-tizen-staging
          path: platforms/samsung-tizen/staging/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: iptv-lg-webos-ipk
          path: platforms/lg-webos/outputs/*.ipk
          if-no-files-found: error

  android:
    name: Android mobile debug APK
    runs-on: ubuntu-latest
    needs: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare Android SDK
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Install player + mobile dependencies
        run: |
          npm install --prefix apps/player --no-audit --no-fund
          npm install --prefix platforms/android --no-audit --no-fund
      - name: Build and prepare Android mobile assets
        run: |
          npm --prefix apps/player run build
          node scripts/prepare-platform.mjs android
      - name: Generate Android mobile project
        working-directory: platforms/android
        run: |
          npx cap add android
          npx cap sync android
      - name: Configure Android release metadata and icon
        run: |
          node scripts/configure-android-release.mjs android
          node scripts/generate-app-icons.mjs android
          node scripts/verify-release-assets.mjs android
      - name: Assemble Android debug APK and unsigned release bundle
        working-directory: platforms/android/android
        run: ./gradlew assembleDebug bundleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: iptv-android-debug-apk
          path: platforms/android/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: iptv-android-release-aab-unsigned
          path: platforms/android/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

  android_tv:
    name: Android TV debug APK
    runs-on: ubuntu-latest
    needs: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare Android SDK
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Install player + TV dependencies
        run: |
          npm install --prefix apps/player --no-audit --no-fund
          npm install --prefix platforms/android-tv --no-audit --no-fund
      - name: Build and prepare Android TV assets
        run: |
          npm --prefix apps/player run build
          node scripts/prepare-platform.mjs android-tv
      - name: Generate Android TV project
        working-directory: platforms/android-tv
        run: |
          npx cap add android
          npx cap sync android
      - name: Add TV launcher and Leanback support
        run: node scripts/patch-android-tv.mjs
      - name: Configure Android TV release metadata and icon
        run: |
          node scripts/configure-android-release.mjs android-tv
          node scripts/generate-app-icons.mjs android-tv
          node scripts/verify-release-assets.mjs android-tv
      - name: Assemble Android TV debug APK and unsigned release bundle
        working-directory: platforms/android-tv/android
        run: ./gradlew assembleDebug bundleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: iptv-android-tv-debug-apk
          path: platforms/android-tv/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: iptv-android-tv-release-aab-unsigned
          path: platforms/android-tv/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

  ios:
    name: iOS Simulator app (unsigned)
    runs-on: macos-15
    needs: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install player + iOS dependencies
        run: |
          npm install --prefix apps/player --no-audit --no-fund
          npm install --prefix platforms/ios --no-audit --no-fund
      - name: Build and prepare iOS assets
        run: |
          npm --prefix apps/player run build
          node scripts/prepare-platform.mjs ios
      - name: Generate iOS project
        working-directory: platforms/ios
        run: |
          npx cap add ios
          npx cap sync ios
      - name: Generate and verify iOS app icon
        run: |
          node scripts/generate-app-icons.mjs ios
          node scripts/verify-release-assets.mjs ios
      - name: Compile simulator app without code signing
        working-directory: platforms/ios
        run: |
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build-ios \
            MARKETING_VERSION=0.5.1 CURRENT_PROJECT_VERSION=6 CODE_SIGNING_ALLOWED=NO build
      - uses: actions/upload-artifact@v4
        with:
          name: iptv-ios-simulator-app
          path: platforms/ios/build-ios/Build/Products/Debug-iphonesimulator/App.app/
          if-no-files-found: error

  windows:
    name: Windows Setup + Portable EXE and launch smoke
    needs: web
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install shared player dependencies
        working-directory: apps/player
        run: npm install --no-audit --no-fund
      - name: Build the shared Windows player
        working-directory: apps/player
        run: |
          npm run typecheck
          npm test
          npm run build
      - name: Stage and validate Windows assets
        run: |
          node scripts/prepare-platform.mjs windows
          node scripts/generate-app-icons.mjs windows
          node scripts/verify-release-assets.mjs windows
      - name: Install Windows desktop dependencies
        working-directory: platforms/windows
        run: npm install --no-audit --no-fund
      - name: Verify unpackaged Windows app launches and displays UI
        working-directory: platforms/windows
        run: npm run smoke
      - name: Build Windows Setup and Portable EXEs
        working-directory: platforms/windows
        run: npm run build:win
      - name: Verify Windows installers and portable launch
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = 'platforms/windows/outputs/IPTV-Setup-0.5.1.exe'
          $portable = 'platforms/windows/outputs/IPTV-Portable-0.5.1.exe'
          foreach ($file in @($setup, $portable)) {
            if (!(Test-Path $file) -or (Get-Item $file).Length -lt 10000000) {
              throw "Missing or unexpectedly small Windows EXE: $file"
            }
          }
          $process = Start-Process -FilePath (Resolve-Path $portable) -ArgumentList '--smoke-test' -PassThru
          try {
            if (!$process.WaitForExit(60000)) {
              Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
              throw 'Portable Windows EXE launch timed out.'
            }
            if ($process.ExitCode -ne 0) { throw "Portable Windows EXE smoke exited with $($process.ExitCode)" }
          } finally {
            if (!$process.HasExited) { Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue }
          }
          Get-FileHash -Algorithm SHA256 $setup,$portable | Format-Table
      - uses: actions/upload-artifact@v4
        with:
          name: iptv-windows-setup-and-portable
          path: |
            platforms/windows/outputs/IPTV-Setup-0.5.1.exe
            platforms/windows/outputs/IPTV-Portable-0.5.1.exe
          if-no-files-found: error

  publish_preview:
    name: Publish v0.5.1 GitHub Preview Release
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    needs: [web, android, android_tv, ios, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
      actions: read
    concurrency:
      group: iptv-v0.5.1-preview-release
      cancel-in-progress: false
    steps:
      - name: Check out the tested source revision
        uses: actions/checkout@v4
      - name: Check whether this version is already published
        id: existing
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.5.1 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            existing_count="$(gh release view v0.5.1 --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets | length')"
            if [ "$existing_count" -ne 11 ]; then
              echo "::error::Version v0.5.1 exists but has $existing_count assets, not 11. Manual review required."
              exit 1
            fi
            echo "Release v0.5.1 already contains all eleven files. Skipping duplicate upload."
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Download exactly the artifacts built by this successful workflow
        if: steps.existing.outputs.present == 'false'
        uses: actions/download-artifact@v4
        with:
          pattern: iptv-*
          path: artifacts
          merge-multiple: false
      - name: Verify and prepare named distributable files
        if: steps.existing.outputs.present == 'false'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          for item in iptv-web iptv-samsung-tizen-staging iptv-lg-webos-ipk \
                      iptv-android-debug-apk iptv-android-release-aab-unsigned \
                      iptv-android-tv-debug-apk iptv-android-tv-release-aab-unsigned \
                      iptv-ios-simulator-app iptv-windows-setup-and-portable; do
            test -d "artifacts/$item" || { echo "::error::Missing CI artifact $item"; exit 1; }
          done
          copy_one() {
            local from="$1" ext="$2" target="$3"
            local files=()
            mapfile -d '' files < <(find "artifacts/$from" -type f -name "*.$ext" -print0)
            if [ "${#files[@]}" -ne 1 ]; then
              echo "::error::$from has ${#files[@]} *.$ext files; expected exactly one."
              exit 1
            fi
            test -s "${files[0]}"
            cp "${files[0]}" "release/$target"
          }
          copy_one iptv-android-debug-apk apk IPTV-v0.5.1-Android-debug.apk
          copy_one iptv-android-release-aab-unsigned aab IPTV-v0.5.1-Android-release-UNSIGNED.aab
          copy_one iptv-android-tv-debug-apk apk IPTV-v0.5.1-AndroidTV-debug.apk
          copy_one iptv-android-tv-release-aab-unsigned aab IPTV-v0.5.1-AndroidTV-release-UNSIGNED.aab
          copy_one iptv-lg-webos-ipk ipk IPTV-v0.5.1-LG-webOS.ipk
          for exe in IPTV-Setup-0.5.1.exe IPTV-Portable-0.5.1.exe; do
            test -s "artifacts/iptv-windows-setup-and-portable/$exe" || {
              echo "::error::Missing Windows release executable $exe"
              exit 1
            }
            cp "artifacts/iptv-windows-setup-and-portable/$exe" "release/$exe"
          done
          test -s artifacts/iptv-web/index.html
          test -s artifacts/iptv-samsung-tizen-staging/config.xml
          test -n "$(find artifacts/iptv-ios-simulator-app -type f -name Info.plist -print -quit)"
          (cd artifacts/iptv-web && zip -qr "$GITHUB_WORKSPACE/release/IPTV-v0.5.1-Web.zip" .)
          (cd artifacts/iptv-samsung-tizen-staging && zip -qr "$GITHUB_WORKSPACE/release/IPTV-v0.5.1-Samsung-Tizen-STAGING.zip" .)
          mkdir -p ios-simulator-package
          if [ -d artifacts/iptv-ios-simulator-app/App.app ]; then
            cp -a artifacts/iptv-ios-simulator-app/App.app ios-simulator-package/
          else
            mkdir -p ios-simulator-package/App.app
            cp -a artifacts/iptv-ios-simulator-app/. ios-simulator-package/App.app/
          fi
          test -s ios-simulator-package/App.app/Info.plist
          (cd ios-simulator-package && zip -qr "$GITHUB_WORKSPACE/release/IPTV-v0.5.1-iOS-Simulator-UNSIGNED.zip" App.app)
          test "$(find release -maxdepth 1 -type f -name '*.exe' | wc -l)" -eq 2
          for archive in release/*.apk release/*.aab release/*.zip; do
            unzip -tq "$archive" >/dev/null
          done
          (cd release && sha256sum IPTV-v0.5.1-* > SHA256SUMS.txt)
          test "$(find release -maxdepth 1 -type f | wc -l)" -eq 11
          ls -lh release/
      - name: Publish the verified preview release with ten platform assets and checksums
        if: steps.existing.outputs.present == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create v0.5.1 release/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "IPTV v0.5.1 — Cross-platform Preview" \
            --notes-file docs/releases/v0.5.1.md \
            --prerelease
          echo "Published https://github.com/$GITHUB_REPOSITORY/releases/tag/v0.5.1"
      - name: Verify GitHub release assets
        if: steps.existing.outputs.present == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view v0.5.1 --repo "$GITHUB_REPOSITORY" --json tagName,isPrerelease,assets \
            --jq '{tag:.tagName,prerelease:.isPrerelease,asset_names:[.assets[].name]}'
          count="$(gh release view v0.5.1 --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets | length')"
          test "$count" -eq 11 || { echo "::error::Expected eleven release assets, received $count"; exit 1; }
