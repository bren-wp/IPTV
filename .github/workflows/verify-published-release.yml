name: Verify published IPTV release

on:
  pull_request:
    paths:
      - '.github/workflows/verify-published-release.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify_release:
    name: Validate v0.5.0 files, archives and SHA-256 digests
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: v0.5.0
    steps:
      - uses: actions/checkout@v4
      - name: Confirm a real published prerelease and exact package list
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json tagName,isPrerelease,targetCommitish,assets \
            --jq '{tag:.tagName,prerelease:.isPrerelease,commit:.targetCommitish,files:[.assets[].name]}'
          test "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isPrerelease --jq .isPrerelease)" = true
          cat > expected.txt <<'EXPECTED'
          IPTV-v0.5.0-Android-debug.apk
          IPTV-v0.5.0-Android-release-UNSIGNED.aab
          IPTV-v0.5.0-AndroidTV-debug.apk
          IPTV-v0.5.0-AndroidTV-release-UNSIGNED.aab
          IPTV-v0.5.0-iOS-Simulator-UNSIGNED.zip
          IPTV-v0.5.0-LG-webOS.ipk
          IPTV-v0.5.0-Samsung-Tizen-STAGING.zip
          IPTV-v0.5.0-Web.zip
          IPTV-Setup-0.5.0.exe
          IPTV-Portable-0.5.0.exe
          SHA256SUMS.txt
          EXPECTED
          sort -o expected.txt expected.txt
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets \
            --jq '.assets[].name' | sort > actual.txt
          diff -u expected.txt actual.txt
      - name: Download every published release asset
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p verify
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir verify
          test "$(find verify -maxdepth 1 -type f | wc -l)" -eq 11
      - name: Verify checksums and package contents
        shell: bash
        run: |
          set -euo pipefail
          cd verify
          sha256sum --check SHA256SUMS.txt
          for file in *.apk *.aab *.zip; do unzip -tq "$file" >/dev/null; done
          test -s IPTV-v0.5.0-LG-webOS.ipk
          for exe in IPTV-Setup-0.5.0.exe IPTV-Portable-0.5.0.exe; do
            test -s "$exe"
            test "$(stat -c '%s' "$exe")" -gt 10000000
          done
          unzip -Z1 IPTV-v0.5.0-Web.zip | grep -qx 'index.html'
          unzip -Z1 IPTV-v0.5.0-Samsung-Tizen-STAGING.zip | grep -qx 'config.xml'
          unzip -Z1 IPTV-v0.5.0-iOS-Simulator-UNSIGNED.zip | grep -qx 'App.app/Info.plist'
          echo "Verified all ten published v0.5.0 platform packages and checksum manifest."
