name: IPTV Public Web Deployment

on:
  push:
    branches: [main]
    paths:
      - 'apps/player/**'
      - '!apps/player/public/catalog.json'
      - 'scripts/prepare-web-public.mjs'
      - 'scripts/public-playlist-url.mjs'
      - 'scripts/tests/**'
      - 'scripts/hosting/**'
      - '.github/workflows/deploy-web.yml'
  schedule:
    # Catalog sync attempts to run at minute 19; deploy a fresh snapshot afterwards.
    # GitHub's scheduler is best effort and may be delayed.
    - cron: '41 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: iptv-public-site
  cancel-in-progress: false

jobs:
  web:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the latest available validated directory
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        working-directory: apps/player
        run: npm install --no-audit --no-fund
      - name: Check TypeScript and unit tests
        working-directory: apps/player
        run: |
          npm run typecheck
          npm test
      - name: Public playlist URL policy regression tests
        run: node --test scripts/tests/*.test.mjs
      - name: Build the premium web player
        working-directory: apps/player
        run: npm run build
      - name: Publish same-origin catalog and read-only metadata endpoints
        run: node scripts/prepare-web-public.mjs
      - name: Validate static site, public feeds and branding
        shell: bash
        run: |
          set -euo pipefail
          test -s apps/player/dist/index.html
          test -s apps/player/dist/catalog.json
          test -s apps/player/dist/api/catalog.json
          test -s apps/player/dist/api/status.json
          test -s apps/player/dist/api/playlist.m3u
          test -s apps/player/dist/playlist.m3u
          test -s apps/player/dist/.htaccess
          test -f apps/player/dist/.nojekyll
          test -s apps/player/dist/brand-symbol.svg
          cmp apps/player/dist/catalog.json apps/player/dist/api/catalog.json
          cmp apps/player/dist/playlist.m3u apps/player/dist/api/playlist.m3u
          node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync('apps/player/dist/api/status.json'));if(x.version!==1||x.channelCount<1||x.playlistChannelCount<1||x.status!=='ok')process.exit(1);console.log(x)"
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/player/dist
      - name: Deploy public web application
        id: deployment
        uses: actions/deploy-pages@v4
